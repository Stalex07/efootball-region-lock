name: Suggestion or question / Sugerencia o pregunta
description: Ideas, improvements or questions / Ideas, mejoras o preguntas
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project! / ¡Gracias por ayudar a mejorar el proyecto!

        If something is not working, use **Problem report / Reportar un problema** instead.
        Si algo no funciona, usa mejor **Problem report / Reportar un problema**.

  - type: textarea
    id: idea
    attributes:
      label: Your suggestion or question / Tu sugerencia o pregunta
      description: What would you like to see, or what do you want to know? / ¿Qué te gustaría ver, o qué quieres saber?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help? / ¿Por qué ayudaría?
      description: Optional. How would it improve your matches or make the tool easier to use? / Opcional. ¿Cómo mejoraría tus partidos o haría la herramienta más fácil de usar?

  - type: input
    id: location
    attributes:
      label: Country / País
      description: Optional. / Opcional.
      placeholder: "e.g. Spain / ej. España"
